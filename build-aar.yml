name: Build JARVIS AARs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'JARVIS_GODOT_COMPLETO_PARA_GODOT.zip'
      - '.github/workflows/build-aar.yml'

permissions:
  contents: read

jobs:
  build-aar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Godot project from uploaded ZIP
        shell: bash
        run: |
          set -euxo pipefail
          mkdir extracted
          unzip -q JARVIS_GODOT_COMPLETO_PARA_GODOT.zip -d extracted
          test -f extracted/JARVIS_GODOT/project.godot
          cp -a extracted/JARVIS_GODOT/. .
          test -f project.godot
          test -f jarvis_android_plugin/gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Fetch llama.cpp and build debug/release AARs
        working-directory: jarvis_android_plugin
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euxo pipefail
          bash scripts/fetch_llama_cpp.sh
          chmod +x gradlew
          ./gradlew --no-daemon -PgodotVersion=4.7.2.stable :jarvis:assembleDebug :jarvis:assembleRelease

      - name: Validate AAR files
        run: |
          set -euxo pipefail
          test -s jarvis_android_plugin/jarvis/build/outputs/aar/jarvis-debug.aar
          test -s jarvis_android_plugin/jarvis/build/outputs/aar/jarvis-release.aar
          python3 tools/verificar_aar.py jarvis_android_plugin/jarvis/build/outputs/aar/jarvis-debug.aar jarvis_android_plugin/jarvis/build/outputs/aar/jarvis-release.aar

      - name: Assemble delivery ZIP
        run: |
          set -euxo pipefail
          mkdir -p addons/jarvis_android/bin package
          cp jarvis_android_plugin/jarvis/build/outputs/aar/jarvis-debug.aar addons/jarvis_android/bin/
          cp jarvis_android_plugin/jarvis/build/outputs/aar/jarvis-release.aar addons/jarvis_android/bin/
          zip -qr package/JARVIS_GODOT_COM_AAR.zip . -x '.git/*' 'package/*' 'jarvis_android_plugin/jarvis/build/*' 'jarvis_android_plugin/jarvis/.cxx/*' 'jarvis_android_plugin/src/main/cpp/llama.cpp/*' 'jarvis_android_plugin/.gradle/*'

      - name: Upload complete project with AARs
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS_GODOT_COM_AAR
          path: package/JARVIS_GODOT_COM_AAR.zip
          if-no-files-found: error

      - name: Upload separate AAR files
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-aar-debug-release
          path: |
            addons/jarvis_android/bin/jarvis-debug.aar
            addons/jarvis_android/bin/jarvis-release.aar
          if-no-files-found: error
